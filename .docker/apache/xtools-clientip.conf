# Test vhost for the client-IP trust boundary. Mounted over the dev vhost by
# docker-compose.clientip.yml and exercised by .docker/clientip/run.sh.
#
# Stripped to just the thing under test: mod_remoteip deciding, by the connecting
# peer's address, whether to trust an inbound X-Forwarded-For. RemoteIPInternalProxy
# trusts ONLY the edge container's fixed address, so an untrusted source (the
# attacker container) can be told apart from a trusted hop. The dev vhost trusts
# the whole compose bridge, which would leave every container trusted and make
# spoof-resistance impossible to test.
#
# Every request gets a 204: header resolution happens before the response, so we
# need no DocumentRoot, php-fpm, or database. %h is logged with a CLIENTIP marker
# to stdout so the driver reads the IP Apache resolved straight out of the logs.

<VirtualHost *:3001>
    ServerName localhost

    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 198.18.0.20

    LogFormat "CLIENTIP %h \"%r\"" clientip
    CustomLog /proc/self/fd/1 clientip
    ErrorLog /proc/self/fd/2

    RewriteEngine On
    RewriteRule ".*" - [R=204,L]
</VirtualHost>
