# Local development overlay, applied automatically by `docker compose up`.
# The working tree is bind-mounted so edits are live; the containers run as the
# host user so files written back (vendor/, node_modules/, var/) stay yours.
services:

  app:
    build:
      target: base
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    env_file:
      - .env.docker
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
    # Lets the replica host names resolve to a Toolforge SSH tunnel on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/var/www

  api:
    build:
      target: base
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    env_file:
      - .env.docker
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/var/www

  web:
    ports:
      - "3001:3001"
    volumes:
      - .:/var/www
      # Live-edit the vhost without rebuilding the web image.
      - ./.docker/apache/xtools.conf:/etc/apache2/sites-available/xtools.conf:ro

  # Node for the front-end assets, so contributors don't need it on the host.
  # public/build is committed, so the stack runs without this service. The
  # profile keeps it out of `docker compose up`; start it on demand instead:
  #   docker compose run --rm assets npm install     # once
  #   docker compose run --rm assets npm run watch   # rebuild while you work
  #   docker compose run --rm assets npm run build   # before you commit
  assets:
    image: node:20.12.2-bookworm-slim
    working_dir: /app
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    profiles:
      - assets
    volumes:
      - .:/app
